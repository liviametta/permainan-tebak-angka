<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tebak Angka</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-card {
      width: 400px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

<div class="card game-card shadow-lg p-4 text-center">
  <h2 class="mb-3">🎯 Tebak Angka</h2>
  <p>Saya memilih angka antara <b>1 - 100</b></p>

  <input type="number" id="guessInput" class="form-control mb-3" placeholder="Masukkan tebakan...">

  <button class="btn btn-primary w-100 mb-2" onclick="checkGuess()">Tebak!</button>
  <button class="btn btn-danger w-100" onclick="resetGame()">Reset Game</button>

  <div id="message" class="mt-3 fw-bold"></div>
  <div id="attempts" class="text-muted"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let randomNumber = Math.floor(Math.random() * 100) + 1;
  let attemptCount = 0;

  function checkGuess() {
    const userGuess = Number(document.getElementById("guessInput").value);
    const message = document.getElementById("message");
    const attempts = document.getElementById("attempts");

    if (!userGuess) {
      message.innerHTML = "⚠️ Masukkan angka dulu!";
      message.className = "text-warning mt-3 fw-bold";
      return;
    }

    attemptCount++;

    if (userGuess === randomNumber) {
      message.innerHTML = "🎉 Selamat! Tebakan kamu benar!";
      message.className = "text-success mt-3 fw-bold";
    } else if (userGuess > randomNumber) {
      message.innerHTML = "📉 Terlalu besar!";
      message.className = "text-danger mt-3 fw-bold";
    } else {
      message.innerHTML = "📈 Terlalu kecil!";
      message.className = "text-danger mt-3 fw-bold";
    }

    attempts.innerHTML = "Jumlah percobaan: " + attemptCount;
  }

  function resetGame() {
    randomNumber = Math.floor(Math.random() * 100) + 1;
    attemptCount = 0;
    document.getElementById("message").innerHTML = "";
    document.getElementById("attempts").innerHTML = "";
    document.getElementById("guessInput").value = "";
  }
</script>

</body>
</html>
